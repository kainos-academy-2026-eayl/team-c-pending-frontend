name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: docker build -t acraiacademy26.azurecr.io/team-c-pending-frontend:${{ github.sha }} .
      - run: docker login -u team-c-pending-frontend-image-pusher -p ${{ secrets.ACR_PASSWORD }} acraiacademy26.azurecr.io
      - run: docker push acraiacademy26.azurecr.io/team-c-pending-frontend:${{ github.sha }}
