name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: .nvmrc
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker-build-push:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t acraiacademy26.azurecr.io/team-c-pending-frontend:${{ github.sha }} .
      - run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u ${{ secrets.ACR_USERNAME }} --password-stdin acraiacademy26.azurecr.io
      - run: docker push acraiacademy26.azurecr.io/team-c-pending-frontend:${{ github.sha }}
