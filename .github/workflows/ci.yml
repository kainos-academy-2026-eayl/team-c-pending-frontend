name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker-build-push:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t acraiacademy26.azurecr.io/team-c-pending-frontend:${{ github.sha }} .
      - run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u team-c-pending-frontend-image-pusher --password-stdin acraiacademy26.azurecr.io
      - run: docker push acraiacademy26.azurecr.io/team-c-pending-frontend:${{ github.sha }}
